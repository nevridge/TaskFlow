version: 2

updates:
  # Frontend dependencies
  - package-ecosystem: "npm"
    directory: "/TaskFlow.Web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    # Major upgrades of these are tracked as separate, deliberate work (see #277):
    # - typescript: typescript-eslint's peer range caps TypeScript below 6.1.0
    # vitest and @vitest/* form their own group (see #285) because @vitest/coverage-v8
    # peers on an exact vitest version; they must move in one PR, majors included.
    ignore:
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@hey-api/*"
        update-types: ["version-update:semver-major"]
    groups:
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
        exclude-patterns:
          - "vitest"
          - "@vitest/*"

  # Backend dependencies (TaskFlow.sln at the root references both projects)
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    # Major upgrades of Microsoft.OpenApi are tracked as separate, deliberate work (see #279):
    # pinned to 2.x (2.7.5 is the CVE-2026-49451 fix for 2.x). 3.x cannot compile against
    # Microsoft.AspNetCore.OpenApi 10.x (CS0200 on IOpenApiMediaType.Example).
    # Revisit when the project decides to move to .NET 11, then remove this ignore.
    ignore:
      - dependency-name: "Microsoft.OpenApi"
        update-types: ["version-update:semver-major"]
    groups:
      nuget-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # Base images
  - package-ecosystem: "docker"
    directories:
      - "/TaskFlow.Web"
      - "/TaskFlow.Api"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      docker-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # Workflow actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
